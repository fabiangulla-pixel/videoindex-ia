[project]
name = "videoindex"
version = "0.1.0"
description = "VideoIndex IA — plataforma local-first de inteligencia sobre conocimiento audiovisual"
requires-python = ">=3.12,<3.13"
dependencies = [
    "faster-whisper",
    "sentence-transformers",
    "faiss-cpu",
    "spacy",
    "PySide6",
    "keyring",
    "av",
    "numpy",
    # Diarización (quién habla): embeddings de voz ECAPA + agrupamiento.
    # speechbrain arrastra torchaudio; en esta máquina convive sin problema
    # con el torch que ya trae sentence-transformers (2.12 + torchaudio 2.11).
    "speechbrain",
    # torch y scikit-learn llegan como dependencia transitiva de
    # sentence-transformers, pero aquí se usan DIRECTAMENTE (tensores de la
    # diarización y AgglomerativeClustering): se declaran para no depender
    # de que otro paquete siga arrastrándolos.
    "torch",
    "scikit-learn",
    # Descarga de material desde una URL (YouTube y ~1800 sitios más).
    "yt-dlp",
    # Exportación de la transcripción a Word para el trabajo editorial.
    "python-docx",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "pre-commit", "pyinstaller"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["scripts/_experimentos"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: tests que cargan modelos pesados (whisper/embeddings reales); correr con -m slow",
]
addopts = "-m 'not slow'"
