[project]
name = "videoindex"
version = "0.1.0"
description = "VideoIndex IA — plataforma local-first de inteligencia sobre conocimiento audiovisual"
requires-python = ">=3.12,<3.13"
dependencies = [
    "faster-whisper",
    "sentence-transformers",
    "faiss-cpu",
    "spacy",
    "PySide6",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "pre-commit", "pyinstaller"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["scripts/_experimentos"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: tests que cargan modelos pesados (whisper/embeddings reales); correr con -m slow",
]
addopts = "-m 'not slow'"
